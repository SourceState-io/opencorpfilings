name: Feature request
description: Propose a change to the API or the ocf command.
labels: [enhancement]
body:
  - type: textarea
    id: workflow
    attributes:
      label: What you are trying to do
      description: The workflow, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: How the API or command would look. Note that the library keeps original documents and does not normalize accounting meaning.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
